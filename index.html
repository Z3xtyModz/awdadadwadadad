<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Plinko Board</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    canvas {
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    button {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background-color: #2563eb;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <canvas id="plinkoBoard" width="400" height="500"></canvas>
  <button id="dropBtn">Drop Ball</button>

<script>
const canvas = document.getElementById('plinkoBoard');
const ctx = canvas.getContext('2d');

const rows = 8;
const pegRadius = 4;
const ballRadius = 7;
const gravity = 0.25;
const bounceDamping = 0.5;

let pegs = [];
let balls = [];

// Generate triangular peg grid
for (let r = 0; r < rows; r++) {
  const count = r + 3;
  const spacing = 320 / (count + 1);
  for (let c = 0; c < count; c++) {
    pegs.push({
      x: 40 + spacing * (c + 1),
      y: 80 + r * 45
    });
  }
}

function dropBall() {
  balls.push({
    x: 200 + (Math.random() - 0.5) * 8,
    y: 20,
    vx: (Math.random() - 0.5) * 2,
    vy: 0
  });
}

document.getElementById('dropBtn').addEventListener('click', dropBall);

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw pegs
  ctx.fillStyle = '#f59e0b';
  pegs.forEach(peg => {
    ctx.beginPath();
    ctx.arc(peg.x, peg.y, pegRadius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Update and draw balls
  for (let i = balls.length - 1; i >= 0; i--) {
    let b = balls[i];
    b.vy += gravity;
    b.x += b.vx;
    b.y += b.vy;

    // Check collision against pegs
    pegs.forEach(peg => {
      let dx = b.x - peg.x;
      let dy = b.y - peg.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      let minDist = ballRadius + pegRadius;

      if (dist < minDist) {
        let angle = Math.atan2(dy, dx);
        b.x = peg.x + Math.cos(angle) * minDist;
        b.y = peg.y + Math.sin(angle) * minDist;
        b.vx = Math.cos(angle) * 2.5 + (Math.random() - 0.5);
        b.vy = Math.sin(angle) * 2.5 * bounceDamping;
      }
    });

    // Draw current ball
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(b.x, b.y, ballRadius, 0, Math.PI * 2);
    ctx.fill();

    // Clean up finished balls
    if (b.y > canvas.height + 20) {
      balls.splice(i, 1);
    }
  }

  requestAnimationFrame(update);
}

update();
</script>
</body>
</html>
