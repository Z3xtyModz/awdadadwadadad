<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Olympus: Aegis of the Gods - WebGL Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <style>
        :root {
            --gold: #f1c40f;
            --bronze: #cd7f32;
            --dark: #0b0e14;
            --panel: rgba(18, 24, 34, 0.95);
            --font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background: var(--dark); color: #fff; font-family: var(--font); overflow: hidden; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #game-wrapper { position: relative; width: 1280px; height: 720px; border: 3px solid var(--bronze); box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        
        .ui-panel { position: absolute; background: var(--panel); border: 2px solid var(--bronze); border-radius: 8px; padding: 12px; pointer-events: auto; display: none; z-index: 100; }
        
        #talent-modal { position: absolute; top: 30px; left: 140px; width: 1000px; height: 660px; background: var(--panel); border: 3px solid var(--gold); border-radius: 12px; z-index: 200; display: none; padding: 20px; box-shadow: 0 0 50px #000; }
        .talent-header { font-size: 22px; color: var(--gold); text-align: center; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid var(--bronze); padding-bottom: 10px; }
        .talent-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; height: 520px; }
        .talent-column { background: rgba(0,0,0,0.4); border: 1px solid var(--bronze); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .column-title { text-align: center; font-weight: bold; color: var(--gold); font-size: 15px; margin-bottom: 5px; }
        .talent-node { background: #1a252f; border: 2px solid var(--bronze); border-radius: 6px; padding: 8px; cursor: pointer; transition: all 0.2s; }
        .talent-node:hover { border-color: var(--gold); transform: scale(1.02); }
        .talent-node.unlocked { border-color: #2ecc71; background: #1e8449; }
        .talent-name { font-weight: bold; font-size: 13px; color: #fff; }
        .talent-desc { font-size: 11px; color: #bdc3c7; margin-top: 2px; }
        
        #tower-context { width: 280px; }
        .ctx-title { font-size: 15px; font-weight: bold; color: var(--gold); text-align: center; border-bottom: 1px solid var(--bronze); padding-bottom: 6px; margin-bottom: 8px; }
        .ctx-stats { font-size: 11px; color: #ecf0f1; margin-bottom: 10px; line-height: 1.5; }
        .ctx-btn { width: 100%; padding: 8px; margin-top: 6px; background: linear-gradient(180deg, #34495e, #2c3e50); border: 1px solid var(--gold); color: #fff; font-size: 11px; font-weight: bold; border-radius: 4px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; }
        .ctx-btn:hover:not(:disabled) { background: #455a64; }
        .ctx-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #hud-top { position: absolute; top: 0; left: 0; width: 100%; height: 48px; background: rgba(11, 14, 20, 0.9); border-bottom: 2px solid var(--bronze); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; pointer-events: auto; }
        .hud-group { display: flex; gap: 20px; font-weight: bold; font-size: 14px; }
        .hud-val { color: var(--gold); }
        .hud-btn { background: #2c3e50; border: 1px solid var(--gold); color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .hud-btn:hover { background: #34495e; }

        /* Restored Bottom Build Selector Dock */
        #build-bar { position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: rgba(11, 14, 20, 0.95); border-top: 2px solid var(--bronze); display: flex; justify-content: center; align-items: center; gap: 10px; z-index: 10; pointer-events: auto; }
        .build-btn { background: #1a252f; border: 2px solid var(--bronze); border-radius: 6px; padding: 6px 12px; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; }
        .build-btn:hover { border-color: var(--gold); background: #2c3e50; }
        .build-btn.active { border-color: #2ecc71; background: #27ae60; }
        .build-cost { font-size: 10px; color: var(--gold); }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="hud-top">
        <div class="hud-group">
            <div>HP: <span id="hud-hp" class="hud-val">20</span></div>
            <div>Gold: <span id="hud-gold" class="hud-val">450</span></div>
            <div>Favor: <span id="hud-favor" class="hud-val">0</span>/100</div>
            <div>Wave: <span id="hud-wave" class="hud-val">1</span>/15</div>
        </div>
        <div class="hud-group">
            <button id="btn-talents" class="hud-btn">Ascension Tree</button>
            <button id="btn-start-wave" class="hud-btn" style="border-color:#2ecc71; color:#2ecc71;">Start Wave</button>
        </div>
    </div>

    <div id="game-container"></div>

    <div id="build-bar">
        <button class="build-btn active" data-type="zeus">⚡ Zeus<span class="build-cost">100G</span></button>
        <button class="build-btn" data-type="poseidon">🌊 Poseidon<span class="build-cost">120G</span></button>
        <button class="build-btn" data-type="hephaestus">🔥 Vulcan<span class="build-cost">140G</span></button>
        <button class="build-btn" data-type="artemis">🏹 Artemis<span class="build-cost">130G</span></button>
        <button class="build-btn" data-type="hades">💀 Hades<span class="build-cost">150G</span></button>
        <button class="build-btn" data-type="chronos">⏳ Chronos<span class="build-cost">135G</span></button>
        <button class="build-btn" data-type="barricade">🛡️ Aegis Wall<span class="build-cost">50G</span></button>
    </div>

    <div id="tower-context" class="ui-panel">
        <div id="ctx-name" class="ctx-title">Zeus Spire</div>
        <div id="ctx-stats" class="ctx-stats"></div>
        <button id="btn-up-a" class="ctx-btn"><span id="title-up-a">Branch A</span><span id="desc-up-a" style="font-weight:normal;color:#bdc3c7;"></span></button>
        <button id="btn-up-b" class="ctx-btn"><span id="title-up-b">Branch B</span><span id="desc-up-b" style="font-weight:normal;color:#bdc3c7;"></span></button>
        <button id="btn-sell" class="ctx-btn" style="border-color:#e74c3c; margin-top:10px;"><span style="color:#e74c3c;">Deconstruct Tower</span><span id="cost-sell" style="font-weight:normal;color:#bdc3c7;">Recycle for 50G</span></button>
    </div>

    <div id="talent-modal">
        <div class="talent-header">Ascension Talent Tree Matrix (Unspent Essence: <span id="talent-points">0</span>)</div>
        <div class="talent-grid">
            <div class="talent-column" id="col-offense">
                <div class="column-title">Offensive Might</div>
            </div>
            <div class="talent-column" id="col-defense">
                <div class="column-title">Olympian Defense</div>
            </div>
            <div class="talent-column" id="col-economy">
                <div class="column-title">Divine Economy</div>
            </div>
        </div>
        <button id="btn-close-talents" class="hud-btn" style="margin-top: 15px; width: 100%;">Close Matrix</button>
    </div>
</div>

<script>
/**
 * MOUNT OLYMPUS: AEGIS OF THE GODS
 * Complete Hardened WebGL Architecture
 */

class AudioEngine {
    constructor() { this.ctx = null; this.masterVolume = 0.3; }
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    playTone(freq, type = 'sine', duration = 0.2, pan = 0, glideFreq = null) {
        try {
            this.init();
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const panner = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;

            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (glideFreq) osc.frequency.exponentialRampToValueAtTime(glideFreq, this.ctx.currentTime + duration);

            gain.gain.setValueAtTime(this.masterVolume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

            if (panner) {
                panner.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), this.ctx.currentTime);
                osc.connect(panner); panner.connect(gain);
            } else { osc.connect(gain); }

            gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }
    playZap(pan = 0) { this.playTone(800, 'sawtooth', 0.15, pan, 150); }
    playSplash(pan = 0) { this.playTone(180, 'triangle', 0.3, pan, 40); }
    playCrit(pan = 0) { this.playTone(1200, 'square', 0.25, pan, 300); }
    playErupt() { this.playTone(80, 'sawtooth', 0.8, 0, 20); }
}

const audio = new AudioEngine();

const SAVE_KEY = 'olympus_td_commercial_save';
const TALENT_NODES = [
    { id: 'off_1', col: 'col-offense', name: 'Divine Might', desc: '+10% Overall Damage', cost: 1, req: null },
    { id: 'off_2', col: 'col-offense', name: 'Overcharge', desc: '+15% Attack Speed', cost: 1, req: 'off_1' },
    { id: 'off_3', col: 'col-offense', name: 'Elemental Surge', desc: '+25% Status Reaction Damage', cost: 2, req: 'off_2' },
    { id: 'off_4', col: 'col-offense', name: 'Precision Lethality', desc: '+15% Critical Strike Chance', cost: 2, req: 'off_3' },
    { id: 'off_5', col: 'col-offense', name: 'Zeus Apex', desc: 'Shock reaction stuns for +0.5s extra', cost: 3, req: 'off_4' },
    { id: 'def_1', col: 'col-defense', name: 'Olympian Aegis', desc: '+5 Max Olympus Health', cost: 1, req: null },
    { id: 'def_2', col: 'col-defense', name: 'Fortified Spires', desc: 'Towers resist status disabling by 50%', cost: 1, req: 'def_1' },
    { id: 'def_3', col: 'col-defense', name: 'Chronos Ward', desc: 'Slow all enemies globally by 10%', cost: 2, req: 'def_2' },
    { id: 'def_4', col: 'col-defense', name: 'Retributive Aura', desc: 'Enemies reaching base suffer 100 true damage', cost: 2, req: 'def_3' },
    { id: 'def_5', col: 'col-defense', name: 'Sanctuary', desc: 'Regenerate 1 Life at wave end', cost: 3, req: 'def_4' },
    { id: 'eco_1', col: 'col-economy', name: 'Midas Touch', desc: '+100 Bonus Starting Gold', cost: 1, req: null },
    { id: 'eco_2', col: 'col-economy', name: 'Bounty Hunter', desc: '+2 Extra Gold per Kill', cost: 1, req: 'eco_1' },
    { id: 'eco_3', col: 'col-economy', name: 'Favor Resonance', desc: '+25% Favor Generation Rate', cost: 2, req: 'eco_2' },
    { id: 'eco_4', col: 'col-economy', name: 'Architect Discount', desc: '-10% Tower Build & Upgrade Costs', cost: 2, req: 'eco_3' },
    { id: 'eco_5', col: 'col-economy', name: 'Tribute of Typhon', desc: '+250 Bonus Gold upon Boss Wave Start', cost: 3, req: 'eco_4' }
];

class PersistenceEngine {
    constructor() { this.data = this.load(); }
    load() {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) { try { return JSON.parse(raw); } catch (e) {} }
        return { points: 5, unlocked: [], highScore: 0 };
    }
    save() { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); }
    isUnlocked(id) { return this.data.unlocked.includes(id); }
    unlock(id) {
        const node = TALENT_NODES.find(n => n.id === id);
        if (!node || this.data.points < node.cost || this.isUnlocked(id)) return false;
        if (node.req && !this.isUnlocked(node.req)) return false;
        this.data.points -= node.cost;
        this.data.unlocked.push(id);
        this.save();
        return true;
    }
}

const storage = new PersistenceEngine();

const TOWER_SPECS = {
    zeus: { name: 'Zeus Spire', cost: 100, range: 180, damage: 40, rate: 0.6, color: 0xf1c40f, element: 'shocked', branchA: { name: 'Conduit Master', cost: 160, desc: 'Splits lightning to targets' }, branchB: { name: 'Hyper Sniper', cost: 175, desc: 'Extreme single-target damage' } },
    poseidon: { name: 'Poseidon Surge', cost: 120, range: 140, damage: 25, rate: 1.2, color: 0x3498db, element: 'wet', branchA: { name: 'Tsunami Wave', cost: 150, desc: 'Heavy AoE knockback wave' }, branchB: { name: 'Maelstrom Pool', cost: 165, desc: 'Persistent vortex slow field' } },
    hephaestus: { name: 'Vulcan Forge', cost: 140, range: 120, damage: 35, rate: 0.8, color: 0xe67e22, element: 'burned', branchA: { name: 'Magma Eruption', cost: 180, desc: 'Leaves persistent burning pools' }, branchB: { name: 'Molten Melt', cost: 170, desc: 'Completely strips enemy armor' } },
    artemis: { name: 'Artemis Bow', cost: 130, range: 280, damage: 110, rate: 1.8, color: 0x2ecc71, element: 'physical', branchA: { name: 'Volley Bow', cost: 175, desc: 'Fires 3 arrows in spread' }, branchB: { name: 'Executioner', cost: 190, desc: 'Devastating critical strikes' } },
    hades: { name: 'Hades Obelisk', cost: 150, range: 130, damage: 2.0, rate: 0.05, color: 0x9b59b6, element: 'cursed', branchA: { name: 'Soul Harvester', cost: 185, desc: 'Gains permanent stacking power' }, branchB: { name: 'Death Aura', cost: 200, desc: 'Curses all enemies globally' } },
    chronos: { name: 'Chronos Dial', cost: 135, range: 150, damage: 15, rate: 1.0, color: 0x1abc9c, element: 'frozen', branchA: { name: 'Stasis Lock', cost: 170, desc: 'Freezes targets completely 1.5s' }, branchB: { name: 'Entropy Field', cost: 180, desc: 'Accelerates status damage rate' } },
    barricade: { name: 'Aegis Wall', cost: 50, range: 0, damage: 0, rate: 99, color: 0x7f8c8d, element: 'none', branchA: { name: 'Spike Barrier', cost: 80, desc: 'Reflects melee damage back' }, branchB: { name: 'Reflective Shield', cost: 90, desc: 'Absorbs boss blasts' } }
};

class BootScene extends Phaser.Scene {
    constructor() { super('BootScene'); }
    create() {
        const gfx = this.make.graphics({ x: 0, y: 0, add: false });

        gfx.clear(); gfx.fillStyle(0x2c3e50, 1); gfx.fillCircle(24, 24, 22);
        gfx.lineStyle(3, 0xf1c40f, 1); gfx.strokeCircle(24, 24, 22);
        gfx.generateTexture('tower-base', 48, 48);

        gfx.clear(); gfx.fillStyle(0xd35400, 0.4); gfx.fillRect(0, 0, 64, 60);
        gfx.lineStyle(2, 0xe67e22, 0.8); gfx.strokeRect(2, 2, 60, 56);
        gfx.generateTexture('tile-highground', 64, 60);

        gfx.clear(); gfx.fillStyle(0xc0392b, 0.8); gfx.fillTriangle(32, 4, 4, 60, 60, 60);
        gfx.fillStyle(0xf1c40f, 1); gfx.fillCircle(32, 24, 8);
        gfx.generateTexture('hazard-volcano', 64, 64);

        gfx.clear(); gfx.fillStyle(0xe74c3c, 1); gfx.fillCircle(16, 16, 14);
        gfx.fillStyle(0x2c3e50, 1); gfx.fillRect(12, 2, 8, 6);
        gfx.generateTexture('enemy-satyr', 32, 32);

        gfx.clear(); gfx.fillStyle(0xf39c12, 1); gfx.fillTriangle(16, 2, 2, 30, 30, 30);
        gfx.generateTexture('enemy-harpy', 32, 32);

        gfx.clear(); gfx.fillStyle(0x7f8c8d, 1); gfx.fillCircle(24, 24, 22);
        gfx.fillStyle(0xe74c3c, 1); gfx.fillCircle(30, 24, 6);
        gfx.generateTexture('enemy-cyclops', 48, 48);

        gfx.clear(); gfx.fillStyle(0x8e44ad, 1); gfx.fillCircle(36, 36, 34);
        gfx.lineStyle(4, 0xf1c40f, 1); gfx.strokeCircle(36, 36, 34);
        gfx.generateTexture('enemy-typhon', 72, 72);

        gfx.clear(); gfx.fillStyle(0xffffff, 1); gfx.fillCircle(4, 4, 4);
        gfx.generateTexture('particle-bolt', 8, 8);

        this.scene.start('GameScene');
    }
}

class GameScene extends Phaser.Scene {
    constructor() { super('GameScene'); }

    create() {
        this.gold = 450 + (storage.isUnlocked('eco_1') ? 100 : 0);
        this.hp = 20 + (storage.isUnlocked('def_1') ? 5 : 0);
        this.favor = 0;
        this.wave = 1;
        this.waveActive = false;
        this.selectedTowerType = 'zeus';
        this.selectedTowerInstance = null;
        this.spawnQueue = [];

        this.setupMap();
        this.setupGroups();
        this.setupInputs();
        this.setupParticles();
        this.setupUI();

        this.volcanoCooldown = 0;
    }

    setupMap() {
        this.pathGround1 = new Phaser.Curves.Path(0, 180);
        this.pathGround1.lineTo(320, 180).lineTo(320, 480).lineTo(800, 480).lineTo(800, 180).lineTo(1280, 180);

        this.pathGround2 = new Phaser.Curves.Path(0, 540);
        this.pathGround2.lineTo(480, 540).lineTo(480, 300).lineTo(1020, 300).lineTo(1020, 540).lineTo(1280, 540);

        this.pathFlying = new Phaser.Curves.Path(0, 360);
        this.pathFlying.lineTo(1280, 360);

        const pathGfx = this.add.graphics();
        pathGfx.lineStyle(36, 0x2c3e50, 0.7);
        this.pathGround1.draw(pathGfx);
        this.pathGround2.draw(pathGfx);
        pathGfx.lineStyle(20, 0x34495e, 0.5);
        this.pathFlying.draw(pathGfx);

        this.highGroundNodes = [ { x: 200, y: 100 }, { x: 600, y: 390 }, { x: 920, y: 100 }, { x: 380, y: 390 } ];
        this.highGroundNodes.forEach(node => {
            const tile = this.add.image(node.x, node.y, 'tile-highground').setInteractive();
            tile.isHighGround = true;
        });

        this.volcanoTile = this.add.image(640, 60, 'hazard-volcano').setInteractive();
        this.volcanoTile.on('pointerdown', () => this.triggerVolcanoHazard());
    }

    setupGroups() {
        this.towers = this.add.group({ runChildUpdate: false });
        this.enemies = this.add.group({ runChildUpdate: false });
        this.projectiles = this.add.group({ runChildUpdate: false });
    }

    setupInputs() {
        this.input.on('pointerdown', (pointer) => {
            audio.init();
            if (pointer.y < 50 || pointer.y > 650) return;

            const x = Math.floor(pointer.x / 40) * 40 + 20;
            const y = Math.floor(pointer.y / 40) * 40 + 20;

            let clickedTower = null;
            this.towers.getChildren().forEach(t => {
                if (t.active && Phaser.Math.Distance.Between(t.x, t.y, pointer.x, pointer.y) < 25) clickedTower = t;
            });

            if (clickedTower) {
                this.openContextWindow(clickedTower);
                return;
            }

            this.closeContextWindow();

            const spec = TOWER_SPECS[this.selectedTowerType];
            const cost = storage.isUnlocked('eco_4') ? Math.floor(spec.cost * 0.9) : spec.cost;

            if (this.gold >= cost) {
                const isHigh = this.highGroundNodes.some(n => Math.hypot(n.x - x, n.y - y) < 30);
                this.gold -= cost;
                const tower = new Tower(this, x, y, this.selectedTowerType, isHigh);
                this.towers.add(tower);
                audio.playZap((x - 640) / 640);
                this.updateHUD();
            }
        });
    }

    setupParticles() {
        this.emitter = this.add.particles(0, 0, 'particle-bolt', {
            speed: { min: 50, max: 150 },
            scale: { start: 1, end: 0 },
            lifespan: 300,
            blendMode: 'ADD',
            emitting: false
        });
    }

    setupUI() {
        document.querySelectorAll('.build-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.build-btn').forEach(b => b.classList.remove('active'));
                const target = e.currentTarget;
                target.classList.add('active');
                this.selectedTowerType = target.getAttribute('data-type');
            };
        });

        document.getElementById('btn-talents').onclick = () => {
            document.getElementById('talent-modal').style.display = 'block';
            this.renderTalentTree();
        };
        document.getElementById('btn-close-talents').onclick = () => {
            document.getElementById('talent-modal').style.display = 'none';
        };
        document.getElementById('btn-start-wave').onclick = () => this.startNextWave();
        document.getElementById('btn-up-a').onclick = () => this.upgradeSelected('A');
        document.getElementById('btn-up-b').onclick = () => this.upgradeSelected('B');
        document.getElementById('btn-sell').onclick = () => this.sellSelected();

        this.updateHUD();
    }

    triggerVolcanoHazard() {
        if (this.volcanoCooldown > 0) return;
        this.volcanoCooldown = 15.0;
        audio.playErupt();
        this.cameras.main.shake(500, 0.01);

        this.enemies.getChildren().forEach(e => {
            if (e.active && !e.flying) {
                e.applyDamage(300, 'burned', 1.0);
                if (e.active) this.emitter.explode(20, e.x, e.y);
            }
        });
    }

    startNextWave() {
        if (this.waveActive) return;
        this.waveActive = true;
        this.spawnQueue = [];

        const count = 10 + this.wave * 4;
        const hpMult = 1 + (this.wave - 1) * 0.35;

        if (this.wave % 5 === 0 && storage.isUnlocked('eco_5')) {
            this.gold += 250;
            this.updateHUD();
        }

        for (let i = 0; i < count; i++) {
            let type = 'satyr';
            if (this.wave >= 2 && i % 3 === 0) type = 'harpy';
            if (this.wave >= 3 && i % 4 === 0) type = 'cyclops';
            this.spawnQueue.push({ type, hpMult, delay: i * 800 });
        }

        if (this.wave % 5 === 0) {
            this.spawnQueue.push({ type: 'typhon', hpMult: hpMult * 1.8, delay: count * 800 + 1000 });
        }
    }

    openContextWindow(tower) {
        this.selectedTowerInstance = tower;
        const ctxWin = document.getElementById('tower-context');
        ctxWin.style.display = 'block';
        ctxWin.style.left = `${Math.min(960, tower.x + 20)}px`;
        ctxWin.style.top = `${Math.min(480, tower.y - 20)}px`;

        document.getElementById('ctx-name').innerText = `${tower.spec.name} ${tower.branch ? '[' + tower.branch + ']' : ''}`;
        document.getElementById('ctx-stats').innerHTML = `
            <b>Damage Dealt:</b> ${Math.round(tower.totalDamage)}<br>
            <b>Enemies Slain:</b> ${tower.kills}<br>
            <b>Combos Triggered:</b> ${tower.synergiesTriggered}<br>
            <b>Base Range/Dmg:</b> ${Math.round(tower.range)} / ${Math.round(tower.damage)}
        `;

        const btnA = document.getElementById('btn-up-a');
        const btnB = document.getElementById('btn-up-b');

        if (tower.branch) {
            btnA.disabled = true; btnB.disabled = true;
            document.getElementById('title-up-a').innerText = 'Specialization Active';
            document.getElementById('desc-up-a').innerText = tower.branch;
            document.getElementById('title-up-b').innerText = 'Max Level Reached';
            document.getElementById('desc-up-b').innerText = '';
        } else {
            btnA.disabled = this.gold < tower.spec.branchA.cost;
            btnB.disabled = this.gold < tower.spec.branchB.cost;
            document.getElementById('title-up-a').innerText = `${tower.spec.branchA.name} (${tower.spec.branchA.cost}G)`;
            document.getElementById('desc-up-a').innerText = tower.spec.branchA.desc;
            document.getElementById('title-up-b').innerText = `${tower.spec.branchB.name} (${tower.spec.branchB.cost}G)`;
            document.getElementById('desc-up-b').innerText = tower.spec.branchB.desc;
        }
    }

    closeContextWindow() {
        document.getElementById('tower-context').style.display = 'none';
        this.selectedTowerInstance = null;
    }

    upgradeSelected(branchType) {
        const t = this.selectedTowerInstance;
        if (!t || !t.active || t.branch) return;
        const bData = branchType === 'A' ? t.spec.branchA : t.spec.branchB;
        if (this.gold >= bData.cost) {
            this.gold -= bData.cost;
            t.branch = bData.name;
            t.damage *= 1.8;
            t.range *= 1.25;
            this.closeContextWindow();
            this.updateHUD();
        }
    }

    sellSelected() {
        const t = this.selectedTowerInstance;
        if (!t || !t.active) return;
        this.gold += Math.floor(t.spec.cost * 0.6);
        t.destroy();
        this.closeContextWindow();
        this.updateHUD();
    }

    renderTalentTree() {
        document.getElementById('talent-points').innerText = storage.data.points;
        ['col-offense', 'col-defense', 'col-economy'].forEach(colId => {
            const container = document.getElementById(colId);
            container.innerHTML = `<div class="column-title">${colId.replace('col-', '').toUpperCase()}</div>`;
            TALENT_NODES.filter(n => n.col === colId).forEach(node => {
                const unlocked = storage.isUnlocked(node.id);
                const div = document.createElement('div');
                div.className = `talent-node ${unlocked ? 'unlocked' : ''}`;
                div.innerHTML = `<div class="talent-name">${node.name} (${node.cost} Essence)</div><div class="talent-desc">${node.desc}</div>`;
                div.onclick = () => {
                    if (storage.unlock(node.id)) this.renderTalentTree();
                };
                container.appendChild(div);
            });
        });
    }

    updateHUD() {
        document.getElementById('hud-hp').innerText = this.hp;
        document.getElementById('hud-gold').innerText = Math.floor(this.gold);
        document.getElementById('hud-favor').innerText = Math.floor(this.favor);
        document.getElementById('hud-wave').innerText = this.wave;
    }

    update(time, delta) {
        const dt = delta / 1000;
        if (this.volcanoCooldown > 0) this.volcanoCooldown -= dt;

        if (this.waveActive && this.spawnQueue.length > 0) {
            for (let i = this.spawnQueue.length - 1; i >= 0; i--) {
                const sq = this.spawnQueue[i];
                sq.delay -= delta;
                if (sq.delay <= 0) {
                    const path = sq.type === 'harpy' ? this.pathFlying : (i % 2 === 0 ? this.pathGround1 : this.pathGround2);
                    const enemy = new Enemy(this, path, sq.type, sq.hpMult);
                    this.enemies.add(enemy);
                    this.spawnQueue.splice(i, 1);
                }
            }
        }

        if (this.waveActive && this.spawnQueue.length === 0 && this.enemies.countActive() === 0) {
            this.waveActive = false;
            this.wave++;
            if (storage.isUnlocked('def_5')) this.hp = Math.min(30, this.hp + 1);
            this.gold += 100 + this.wave * 15;
            this.updateHUD();
        }

        this.towers.getChildren().forEach(t => { if (t.active) t.update(time, dt); });
        this.enemies.getChildren().forEach(e => { if (e.active) e.update(time, dt); });
        this.projectiles.getChildren().forEach(p => { if (p.active) p.update(time, dt); });
    }
}

class Tower extends Phaser.GameObjects.Container {
    constructor(scene, x, y, typeKey, isHighGround) {
        super(scene, x, y);
        this.scene = scene;
        this.typeKey = typeKey;
        this.spec = TOWER_SPECS[typeKey];
        this.isHighGround = isHighGround;

        this.damage = this.spec.damage * (isHighGround ? 1.25 : 1.0) * (storage.isUnlocked('off_1') ? 1.1 : 1.0);
        this.range = this.spec.range * (isHighGround ? 1.25 : 1.0);
        this.rate = this.spec.rate * (storage.isUnlocked('off_2') ? 0.85 : 1.0);
        this.cooldown = 0;
        this.disabledTimer = 0;
        this.branch = null;

        this.totalDamage = 0;
        this.kills = 0;
        this.synergiesTriggered = 0;

        this.baseSprite = scene.add.image(0, 0, 'tower-base');
        this.add(this.baseSprite);

        this.headGfx = scene.add.graphics();
        this.headGfx.fillStyle(this.spec.color, 1);
        this.headGfx.fillTriangle(12, 0, -10, -8, -10, 8);
        this.add(this.headGfx);

        scene.add.existing(this);
    }

    update(time, dt) {
        if (!this.active) return;

        if (this.disabledTimer > 0) {
            this.disabledTimer -= dt;
            this.alpha = 0.4;
            return;
        }
        this.alpha = 1.0;

        if (this.spec.range === 0) return; // Barricade non-firing tower

        if (this.cooldown > 0) this.cooldown -= dt;

        let target = null;
        let maxDist = -1;

        this.scene.enemies.getChildren().forEach(e => {
            if (e.active) {
                const dist = Phaser.Math.Distance.Between(this.x, this.y, e.x, e.y);
                if (dist <= this.range && e.pathProgress > maxDist) {
                    maxDist = e.pathProgress;
                    target = e;
                }
            }
        });

        if (target) {
            const bulletSpeed = 650;
            const dist = Phaser.Math.Distance.Between(this.x, this.y, target.x, target.y);
            const timeToTarget = dist / bulletSpeed;
            const predictedX = target.x + target.vx * timeToTarget;
            const predictedY = target.y + target.vy * timeToTarget;

            const angle = Phaser.Math.Angle.Between(this.x, this.y, predictedX, predictedY);
            this.headGfx.rotation = Phaser.Math.Angle.RotateTo(this.headGfx.rotation, angle, 0.1);

            if (this.cooldown <= 0) {
                this.fire(target);
                this.cooldown = this.rate;
            }
        }
    }

    fire(target) {
        const proj = new Projectile(this.scene, this.x, this.y, target, this);
        this.scene.projectiles.add(proj);
        audio.playZap((this.x - 640) / 640);
    }
}

class Enemy extends Phaser.GameObjects.Container {
    constructor(scene, path, typeKey, hpMult) {
        const startPoint = path.getStartPoint();
        super(scene, startPoint.x, startPoint.y);
        this.scene = scene;
        this.path = path;
        this.typeKey = typeKey;
        this.pathProgress = 0;

        this.flying = typeKey === 'harpy';
        this.boss = typeKey === 'typhon';

        const baseHp = typeKey === 'satyr' ? 90 : (typeKey === 'harpy' ? 70 : (typeKey === 'cyclops' ? 450 : 3000));
        this.maxHp = baseHp * hpMult;
        this.hp = this.maxHp;
        this.speed = typeKey === 'harpy' ? 140 : (typeKey === 'satyr' ? 110 : (typeKey === 'cyclops' ? 60 : 40));

        this.shieldHp = typeKey === 'cyclops' ? 300 : (this.boss ? 1500 : 0);
        this.bossPhase = 1;
        this.summonTimer = 0;

        this.statuses = { wet: 0, shocked: 0, burned: 0, frozen: 0, cursed: 0, stun: 0 };
        this.vx = 0; this.vy = 0;

        this.sprite = scene.add.image(0, 0, `enemy-${typeKey}`);
        this.add(this.sprite);

        this.hpBar = scene.add.graphics();
        this.add(this.hpBar);

        scene.add.existing(this);
    }

    update(time, dt) {
        if (!this.active) return;

        if (this.statuses.stun > 0) {
            this.statuses.stun -= dt;
            return;
        }

        let currentSpeed = this.speed;
        if (this.typeKey === 'satyr') {
            let nearby = 0;
            this.scene.enemies.getChildren().forEach(other => {
                if (other.active && other !== this && Phaser.Math.Distance.Between(this.x, this.y, other.x, other.y) < 60) nearby++;
            });
            if (nearby >= 2) currentSpeed *= 1.4;
        }

        if (this.statuses.frozen > 0) currentSpeed *= 0.4;

        const prevX = this.x; const prevY = this.y;
        this.pathProgress += (currentSpeed / this.path.getLength()) * dt;

        if (this.pathProgress >= 1.0) {
            this.scene.hp -= this.boss ? 5 : 1;
            if (storage.isUnlocked('def_4')) this.applyDamage(100, 'none', 1.0);
            this.scene.updateHUD();
            this.destroy();
            return;
        }

        const point = this.path.getPoint(this.pathProgress);
        this.x = point.x; this.y = point.y;
        this.vx = (this.x - prevX) / dt; this.vy = (this.y - prevY) / dt;

        // Typhon 3-Phase Fight Mechanics
        if (this.boss) {
            if (this.hp < this.maxHp * 0.66 && this.bossPhase === 1) {
                this.bossPhase = 2;
                // Phase 2: EMP Pulse disables tower
                const towers = this.scene.towers.getChildren();
                if (towers.length > 0 && towers[0].active) towers[0].disabledTimer = 3.0;
            } else if (this.hp < this.maxHp * 0.33 && this.bossPhase === 2) {
                this.bossPhase = 3;
                this.speed *= 1.6; // Phase 3: Enraged sprint
            }

            if (this.bossPhase === 3) {
                this.summonTimer -= dt;
                if (this.summonTimer <= 0) {
                    this.summonTimer = 5.0; // Phase 3: Summon minions every 5s
                    const minion = new Enemy(this.scene, this.path, 'satyr', 1.0);
                    minion.pathProgress = this.pathProgress;
                    this.scene.enemies.add(minion);
                }
            }
        }

        if (this.statuses.burned > 0) {
            this.statuses.burned -= dt;
            this.applyDamage(20 * dt, 'burned', 1.0);
            if (!this.active) return;
        }

        this.renderHPBar();
    }

    applyDamage(amount, element, critMultiplier = 1.0, sourceTower = null) {
        if (!this.active) return;
        let finalDamage = amount * critMultiplier;

        if (element === 'shocked' && this.statuses.wet > 0) {
            this.statuses.stun = 1.5 + (storage.isUnlocked('off_5') ? 0.5 : 0);
            this.statuses.wet = 0;
            if (sourceTower) sourceTower.synergiesTriggered++;
            audio.playCrit((this.x - 640) / 640);
        }

        if (element === 'physical' && this.statuses.frozen > 0) {
            finalDamage *= 3.0;
            this.statuses.frozen = 0;
            if (sourceTower) sourceTower.synergiesTriggered++;
            audio.playCrit((this.x - 640) / 640);
        }

        if (this.statuses.cursed > 0 && element === 'burned') {
            finalDamage *= 1.5;
            if (sourceTower) sourceTower.synergiesTriggered++;
        }

        if (element !== 'none' && element !== 'physical') {
            this.statuses[element] = 3.0;
        }

        if (this.shieldHp > 0 && element === 'physical') {
            this.shieldHp -= finalDamage * 0.2; // Shield absorbs 80%
            if (this.shieldHp < 0) { finalDamage = -this.shieldHp; this.shieldHp = 0; }
            else return;
        }

        this.hp -= finalDamage;
        if (sourceTower) sourceTower.totalDamage += finalDamage;

        if (this.hp <= 0) {
            if (sourceTower) sourceTower.kills++;
            this.scene.gold += (this.typeKey === 'typhon' ? 250 : 15) + (storage.isUnlocked('eco_2') ? 2 : 0);
            this.scene.favor = Math.min(100, this.scene.favor + 5);
            this.scene.updateHUD();

            if (this.typeKey === 'harpy') {
                this.scene.towers.getChildren().forEach(t => {
                    if (t.active && Phaser.Math.Distance.Between(this.x, this.y, t.x, t.y) < 120) t.disabledTimer = 2.0;
                });
            }

            this.destroy();
        }
    }

    renderHPBar() {
        if (!this.active || !this.hpBar) return;
        this.hpBar.clear();
        const w = 32; const h = 4;
        this.hpBar.fillStyle(0x000000, 0.8);
        this.hpBar.fillRect(-w/2, -22, w, h);
        const pct = Math.max(0, this.hp / this.maxHp);
        this.hpBar.fillStyle(pct > 0.5 ? 0x2ecc71 : 0xe74c3c, 1);
        this.hpBar.fillRect(-w/2, -22, w * pct, h);
    }
}

class Projectile extends Phaser.GameObjects.Image {
    constructor(scene, x, y, target, ownerTower) {
        super(scene, x, y, 'particle-bolt');
        this.scene = scene;
        this.target = target;
        this.ownerTower = ownerTower;
        this.speed = 650;
        this.setTint(ownerTower.spec.color);
        scene.add.existing(this);
    }

    update(time, dt) {
        if (!this.active) return;
        if (!this.target || !this.target.active) {
            this.destroy();
            return;
        }

        const angle = Phaser.Math.Angle.Between(this.x, this.y, this.target.x, this.target.y);
        const step = this.speed * dt;

        this.x += Math.cos(angle) * step;
        this.y += Math.sin(angle) * step;

        if (Phaser.Math.Distance.Between(this.x, this.y, this.target.x, this.target.y) < 12) {
            this.target.applyDamage(this.ownerTower.damage, this.ownerTower.spec.element, 1.0, this.ownerTower);
            if (this.scene.emitter) this.scene.emitter.explode(8, this.x, this.y);
            this.destroy();
        }
    }
}

const config = {
    type: Phaser.WEBGL,
    width: 1280,
    height: 720,
    parent: 'game-container',
    backgroundColor: '#0b0e14',
    scene: [BootScene, GameScene]
};

const game = new Phaser.Game(config);
</script>
