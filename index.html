<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plinko of Olympus</title>
  <style>
    :root {
      --gold: #f59e0b;
      --gold-bright: #fbbf24;
      --crimson: #7f1d1d;
      --lightning: #38bdf8;
      --bg: #0f172a;
      --card-bg: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--gold-bright);
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.4), 2px 2px 0 #000;
      margin-bottom: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .game-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      max-width: 950px;
      width: 100%;
    }

    .panel {
      background: rgba(30, 41, 59, 0.85);
      border: 2px solid #b45309;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(245, 158, 11, 0.15);
      backdrop-filter: blur(8px);
    }

    /* Controls Panel */
    .controls {
      flex: 1;
      min-width: 280px;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-family: system-ui, sans-serif;
    }

    .stat-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--gold-bright); font-family: 'Georgia', serif; }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; }

    input, select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #334155;
      color: #fff;
    }

    button:hover { background: #475569; }

    .btn-drop {
      background: linear-gradient(180deg, #f59e0b 0%, #b45309 100%);
      color: #000;
      font-size: 1.2rem;
      padding: 14px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .btn-drop:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
    }

    .btn-drop:active { transform: translateY(1px); }

    /* Canvas Board */
    .board-container {
      position: relative;
    }

    canvas {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      border-radius: 12px;
      display: block;
    }

    /* History Feed */
    .history-feed {
      display: flex;
      gap: 6px;
      overflow-x: hidden;
      max-width: 480px;
      height: 35px;
      align-items: center;
      margin-top: 10px;
    }

    .history-tag {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      font-family: system-ui, sans-serif;
    }

    @keyframes popIn {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>⚡ Plinko of Olympus ⚡</h1>

  <div class="game-container">
    <!-- Controls Sidebar -->
    <div class="panel controls">
      <div class="stat-box">
        <div class="stat-label">Treasury Balance</div>
        <div class="stat-value" id="balanceDisplay">1,000.00 🏛️</div>
      </div>

      <div class="control-group">
        <label>Bet Amount (Gold Denarii)</label>
        <input type="number" id="betInput" value="10" min="1" max="1000">
        <div class="btn-grid">
          <button onclick="adjustBet(0.5)">½x</button>
          <button onclick="adjustBet(2)">2x</button>
        </div>
      </div>

      <div class="control-group">
        <label>God's Favor (Risk Level)</label>
        <select id="riskSelect" onchange="updateRisk()">
          <option value="low">Hermes (Low Risk)</option>
          <option value="medium" selected>Athena (Medium Risk)</option>
          <option value="high">Zeus (High Risk)</option>
        </select>
      </div>

      <button class="btn-drop" onclick="dropBall()">Drop Orb ⚡</button>
    </div>

    <!-- Main Game Board -->
    <div class="panel board-container">
      <canvas id="plinkoCanvas" width="480" height="520"></canvas>
      <div class="history-feed" id="historyFeed"></div>
    </div>
  </div>

<script>
// --- AUDIO SYNTHESIZER (Zero external asset files) ---
const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type = 'sine', duration = 0.1, vol = 0.1) {
  if (AudioCtx.state === 'suspended') AudioCtx.resume();
  const osc = AudioCtx.createOscillator();
  const gain = AudioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, AudioCtx.currentTime);
  gain.gain.setValueAtTime(vol, AudioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, AudioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(AudioCtx.destination);
  osc.start();
  osc.stop(AudioCtx.currentTime + duration);
}

function playPegSound() { playTone(600 + Math.random() * 300, 'sine', 0.08, 0.08); }
function playWinSound(isBig) {
  if (isBig) {
    [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.3, 0.2), i * 80));
  } else {
    playTone(440, 'triangle', 0.15, 0.15);
  }
}

// --- GAME CONFIG & STATE ---
let balance = 1000;
const canvas = document.getElementById('plinkoCanvas');
const ctx = canvas.getContext('2d');

const rows = 8;
const pegRadius = 5;
const ballRadius = 8;
const gravity = 0.22;
const bounceDamping = 0.55;

let pegs = [];
let particles = [];
let balls = [];
let floatingTexts = [];

const multipliers = {
  low:    [5.6, 2.1, 1.1, 1.0, 0.5, 1.0, 1.1, 2.1, 5.6],
  medium: [13,  3.0, 1.3, 0.7, 0.4, 0.7, 1.3, 3.0, 13],
  high:   [29,  4.0, 1.5, 0.3, 0.2, 0.3, 1.5, 4.0, 29]
};

let currentRisk = 'medium';

// --- INIT BOARD GEOMETRY ---
function initBoard() {
  pegs = [];
  const startY = 60;
  const rowSpacing = 44;
  
  for (let r = 0; r < rows; r++) {
    const count = r + 3;
    const spacing = 360 / (count + 1);
    for (let c = 0; c < count; c++) {
      pegs.push({
        x: 60 + spacing * (c + 1),
        y: startY + r * rowSpacing,
        pulse: 0
      });
    }
  }
}

function getBins() {
  const currentMults = multipliers[currentRisk];
  const binCount = currentMults.length;
  const binWidth = canvas.width / binCount;
  const bins = [];

  for (let i = 0; i < binCount; i++) {
    bins.push({
      x: i * binWidth,
      width: binWidth,
      y: canvas.height - 40,
      height: 35,
      mult: currentMults[i]
    });
  }
  return bins;
}

// --- UI HELPERS ---
function updateRisk() {
  currentRisk = document.getElementById('riskSelect').value;
}

function adjustBet(factor) {
  const input = document.getElementById('betInput');
  let val = Math.max(1, Math.floor(parseFloat(input.value) * factor));
  input.value = val;
}

function updateBalanceDisplay() {
  document.getElementById('balanceDisplay').innerText = `${balance.toFixed(2)} 🏛️`;
}

function addHistory(mult) {
  const feed = document.getElementById('historyFeed');
  const tag = document.createElement('div');
  tag.className = 'history-tag';
  tag.innerText = `${mult}x`;
  
  if (mult >= 3) {
    tag.style.background = '#f59e0b';
    tag.style.color = '#000';
  } else if (mult >= 1) {
    tag.style.background = '#0284c7';
    tag.style.color = '#fff';
  } else {
    tag.style.background = '#334155';
    tag.style.color = '#94a3b8';
  }

  feed.prepend(tag);
  if (feed.children.length > 6) feed.removeChild(feed.lastChild);
}

// --- GAME LOGIC ---
function dropBall() {
  const betInput = document.getElementById('betInput');
  const betAmount = parseFloat(betInput.value);

  if (isNaN(betAmount) || betAmount <= 0 || betAmount > balance) {
    alert("Insufficient Gold Denarii!");
    return;
  }

  balance -= betAmount;
  updateBalanceDisplay();

  // Spawn ball near apex with tiny randomized horizontal push
  balls.push({
    x: canvas.width / 2 + (Math.random() - 0.5) * 6,
    y: 20,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 0,
    bet: betAmount
  });
}

function spawnParticles(x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 1,
      color: color
    });
  }
}

// --- ANIMATION LOOP ---
function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const bins = getBins();

  // 1. Draw Multiplier Bins
  bins.forEach((bin) => {
    let color = '#334155';
    if (bin.mult >= 10) color = '#7f1d1d';
    else if (bin.mult >= 2) color = '#b45309';
    else if (bin.mult >= 1) color = '#1e3a8a';

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(bin.x + 2, bin.y, bin.width - 4, bin.height, 6);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(`${bin.mult}x`, bin.x + bin.width / 2, bin.y + 22);
  });

  // 2. Draw & Update Pegs
  pegs.forEach(peg => {
    if (peg.pulse > 0) peg.pulse -= 0.05;

    ctx.beginPath();
    ctx.arc(peg.x, peg.y, pegRadius + peg.pulse * 2, 0, Math.PI * 2);
    ctx.fillStyle = peg.pulse > 0 ? '#38bdf8' : '#fbbf24';
    ctx.shadowColor = peg.pulse > 0 ? '#38bdf8' : '#f59e0b';
    ctx.shadowBlur = peg.pulse > 0 ? 12 : 4;
    ctx.fill();
    ctx.shadowBlur = 0; // Reset shadow
  });

  // 3. Update & Draw Balls
  for (let i = balls.length - 1; i >= 0; i--) {
    let b = balls[i];
    b.vy += gravity;
    b.x += b.vx;
    b.y += b.vy;

    // Peg collisions
    pegs.forEach(peg => {
      let dx = b.x - peg.x;
      let dy = b.y - peg.y;
      let dist = Math.sqrt(dx * dx + dy * dy);
      let minDist = ballRadius + pegRadius;

      if (dist < minDist) {
        let angle = Math.atan2(dy, dx);
        b.x = peg.x + Math.cos(angle) * minDist;
        b.y = peg.y + Math.sin(angle) * minDist;

        // Bounce physics with random jitter
        b.vx = Math.cos(angle) * 2.8 + (Math.random() - 0.5) * 0.8;
        b.vy = Math.sin(angle) * 2.8 * bounceDamping;

        peg.pulse = 1;
        playPegSound();
        spawnParticles(peg.x, peg.y, '#fbbf24', 4);
      }
    });

    // Outer wall boundaries
    if (b.x - ballRadius < 0) { b.x = ballRadius; b.vx *= -0.5; }
    if (b.x + ballRadius > canvas.width) { b.x = canvas.width - ballRadius; b.vx *= -0.5; }

    // Bin collision detection
    if (b.y + ballRadius >= canvas.height - 40) {
      // Determine landing bin
      let hitBin = bins.find(bin => b.x >= bin.x && b.x <= bin.x + bin.width);
      if (!hitBin) hitBin = bins[0];

      const payout = b.bet * hitBin.mult;
      balance += payout;
      updateBalanceDisplay();
      addHistory(hitBin.mult);
      playWinSound(hitBin.mult >= 2);

      // Floating text effect
      floatingTexts.push({
        text: `+${payout.toFixed(1)}`,
        x: b.x,
        y: b.y - 10,
        alpha: 1
      });

      spawnParticles(b.x, b.y, hitBin.mult >= 2 ? '#fbbf24' : '#38bdf8', 12);
      balls.splice(i, 1);
      continue;
    }

    // Draw glowing Orb
    ctx.beginPath();
    ctx.arc(b.x, b.y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#38bdf8';
    ctx.shadowColor = '#06b6d4';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // 4. Update Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.04;

    if (p.life <= 0) {
      particles.splice(i, 1);
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // 5. Update Floating Text
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 1;
    ft.alpha -= 0.02;

    if (ft.alpha <= 0) {
      floatingTexts.splice(i, 1);
    } else {
      ctx.fillStyle = `rgba(251, 191, 36, ${ft.alpha})`;
      ctx.font = 'bold 16px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
    }
  }

  requestAnimationFrame(update);
}

// Start
initBoard();
update();
</script>
</body>
</html>
